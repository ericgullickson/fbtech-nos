name: Build overlay packages

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - ci/packages
    paths:
      - 'overlay/**'
      - '.github/workflows/build-packages.yml'

permissions:
  contents: read

env:
  PAGES_URL: https://ericgullickson.github.io/fbtech-nos

jobs:
  # Auto-discovers the build matrix from overlay/*/build.sh, so adding a new
  # package only requires adding its directory -- no workflow edit needed.
  # Emits a JSON array of {name, image} objects: image is the contents of
  # overlay/<package>/image if present (a single line, e.g.
  # ghcr.io/ericgullickson/fbtech-nos-build:trixie for heavier packages that
  # need a fuller toolchain), otherwise it defaults to debian:trixie.
  discover:
    runs-on: ubuntu-24.04
    outputs:
      packages: ${{ steps.discover.outputs.packages }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Discover overlay packages
        id: discover
        run: |
          set -euo pipefail
          packages="[]"
          for build_script in overlay/*/build.sh; do
            [ -e "${build_script}" ] || continue
            pkg="$(basename "$(dirname "${build_script}")")"
            image="debian:trixie"
            if [ -s "overlay/${pkg}/image" ]; then
              image="$(tr -d '[:space:]' < "overlay/${pkg}/image")"
            fi
            entry=$(jq -nc --arg name "${pkg}" --arg image "${image}" '{name: $name, image: $image}')
            packages=$(echo "${packages}" | jq -c --argjson e "${entry}" '. + [$e]')
          done
          echo "Discovered packages:"
          echo "${packages}" | jq .
          echo "packages=${packages}" >> "$GITHUB_OUTPUT"

  # Decides which of the discovered packages the build job's matrix should
  # cover. On workflow_dispatch we always build every discovered package. On
  # push, we only rebuild packages whose overlay/<package>/ directory
  # actually changed, so e.g. a docs-only or workflow-only push doesn't
  # needlessly republish every package (dpkg-deb builds are not
  # reproducible, so a no-op rebuild would otherwise just add pool churn --
  # see the version-skip logic in the publish job below).
  changes:
    needs: discover
    runs-on: ubuntu-24.04
    outputs:
      packages: ${{ steps.set.outputs.packages }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine which packages changed
        id: set
        env:
          DISCOVERED: ${{ needs.discover.outputs.packages }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run: building every discovered package."
            echo "packages=${DISCOVERED}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          before="${{ github.event.before }}"
          after="${{ github.sha }}"
          if [ -z "${before}" ] || [ "${before}" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${before}" 2>/dev/null; then
            echo "No usable previous commit to diff against: building every discovered package."
            echo "packages=${DISCOVERED}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=$(git diff --name-only "${before}" "${after}" -- overlay \
            | awk -F/ 'NF>1{print $2}' | sort -u)

          if [ -z "${changed}" ]; then
            echo "No overlay/<package> directories changed."
            echo "packages=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Changed packages:"
          echo "${changed}"
          changed_json=$(printf '%s\n' "${changed}" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          filtered=$(echo "${DISCOVERED}" | jq -c --argjson changed "${changed_json}" \
            '[.[] | select(.name as $n | $changed | index($n))]')
          echo "packages=${filtered}" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.packages != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.changes.outputs.packages) }}
    runs-on: ubuntu-24.04
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install git (bare images may have none)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates

      - name: Checkout repository
        uses: actions/checkout@v6

      # Optional overlay/<package>/deps: one dependency package name per
      # line, whose freshly built .deb must be installed before this
      # package builds (e.g. a future vyos-1x depending on libvyosconfig0
      # built by vyos1x-config). We first try this run's own build
      # artifact for that dependency (in case its matrix leg happened to
      # finish first -- matrix legs run in parallel, so this is opportunistic,
      # not guaranteed); if it isn't available yet we fall back to installing
      # the dependency from the already-published apt repository. See
      # docs/PACKAGES.md.
      - name: Download any already-built dependency artifacts from this run
        if: hashFiles(format('overlay/{0}/deps', matrix.name)) != ''
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: 'debs-*'
          path: /tmp/run-artifacts
          merge-multiple: true
          if-no-artifact-found: ignore

      - name: Install declared dependencies (overlay/<package>/deps)
        if: hashFiles(format('overlay/{0}/deps', matrix.name)) != ''
        run: |
          set -euo pipefail
          deps_file="overlay/${{ matrix.name }}/deps"
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl gnupg

          while IFS= read -r dep || [ -n "${dep}" ]; do
            dep="$(echo "${dep}" | xargs)"
            [ -z "${dep}" ] && continue
            echo "::group::Resolving dependency: ${dep}"
            found=$(ls /tmp/run-artifacts/"${dep}"_*.deb 2>/dev/null || true)
            if [ -n "${found}" ]; then
              echo "Installing ${dep} from this run's build artifact."
              apt-get install -y --no-install-recommends ${found}
            else
              echo "No same-run artifact for ${dep} yet; installing from the published apt repository."
              curl -fsSL "${PAGES_URL}/fbtech-nos-archive-keyring.asc" \
                -o /usr/share/keyrings/fbtech-nos-archive-keyring.asc
              echo "deb [signed-by=/usr/share/keyrings/fbtech-nos-archive-keyring.asc] ${PAGES_URL} trixie main" \
                > /etc/apt/sources.list.d/fbtech-nos.list
              apt-get update
              apt-get install -y --no-install-recommends "${dep}"
            fi
            echo "::endgroup::"
          done < "${deps_file}"

      - name: Build ${{ matrix.name }}
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/out"
          OUT_DIR="${GITHUB_WORKSPACE}/out" bash "overlay/${{ matrix.name }}/build.sh"

      - name: Upload built packages
        uses: actions/upload-artifact@v7
        with:
          name: debs-${{ matrix.name }}
          path: out/*.deb
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download all built packages
        uses: actions/download-artifact@v8
        with:
          pattern: debs-*
          path: artifacts
          merge-multiple: true

      - name: List downloaded packages
        run: ls -la artifacts

      - name: Install reprepro and gnupg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends reprepro gnupg

      - name: Import apt signing key
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          set -euo pipefail
          GNUPGHOME="${RUNNER_TEMP}/gnupg"
          mkdir -m 700 -p "${GNUPGHOME}"
          echo "GNUPGHOME=${GNUPGHOME}" >> "$GITHUB_ENV"
          printf '%s\n' "${APT_SIGNING_KEY}" | gpg --homedir "${GNUPGHOME}" --batch --import
          KEYID=$(gpg --homedir "${GNUPGHOME}" --batch --list-secret-keys --with-colons | awk -F: '/^fpr:/{print $10; exit}')
          if [ -z "${KEYID}" ]; then
            echo "::error::Could not determine signing key fingerprint from APT_SIGNING_KEY secret" >&2
            exit 1
          fi
          echo "KEYID=${KEYID}" >> "$GITHUB_ENV"

      - name: Fetch previous published pool (if any)
        run: |
          set -euo pipefail
          mkdir -p pages-old
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git clone --depth 1 --branch gh-pages \
              "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
              pages-old
          else
            echo "No existing gh-pages branch yet; starting a fresh repository."
          fi

      - name: Build signed apt repository with reprepro
        run: |
          set -euo pipefail
          mkdir -p repo/conf
          cat > repo/conf/distributions <<EOF
          Origin: fbtech-nos
          Label: fbtech-nos
          Codename: trixie
          Architectures: amd64
          Components: main
          Description: fbtech-nos overlay package repository
          SignWith: ${KEYID}
          EOF

          # Carry forward packages published by previous runs, so a package
          # missing from this run (e.g. temporarily removed from the matrix)
          # is not dropped from the repository.
          if [ -d pages-old/pool ]; then
            cp -r pages-old/pool repo/pool
            find repo/pool -name '*.deb' ! -name '*-dbgsym_*' -print0 \
              | xargs -0 -r -n1 reprepro -b repo --keepunreferencedfiles includedeb trixie
          fi

          # Add this run's freshly built packages (skip debug-symbol .debs;
          # they are still available as build artifacts if ever needed).
          #
          # dpkg-deb builds are not byte-reproducible (embedded timestamps),
          # so rebuilding a package without bumping its Debian revision
          # produces a .deb that differs from the one already in the pool
          # under the exact same filename. reprepro refuses to overwrite an
          # existing pool file with different content, so we skip
          # re-including a version that is already published instead of
          # letting that fail the job. To publish a new build of a package
          # whose upstream ref did not change, bump the Debian revision in
          # that package's build.sh (e.g. 3.6-1 -> 3.6-2). See
          # docs/PACKAGES.md.
          while IFS= read -r -d '' deb; do
            pkg=$(dpkg-deb -f "$deb" Package)
            ver=$(dpkg-deb -f "$deb" Version)
            arch=$(dpkg-deb -f "$deb" Architecture)
            existing=$(reprepro -b repo list trixie "$pkg" 2>/dev/null \
              | grep "|${arch}: " | awk '{print $NF}' || true)
            if [ "${existing}" = "${ver}" ]; then
              echo "Skipping ${pkg} ${ver} (${arch}): already published at this version (unchanged Debian revision)."
            else
              reprepro -b repo includedeb trixie "$deb"
            fi
          done < <(find artifacts -name '*.deb' ! -name '*-dbgsym_*' -print0)

          reprepro -b repo export trixie

      - name: Assemble GitHub Pages site
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site
          cp -r repo/pool site/pool
          cp -r repo/dists site/dists
          cp overlay/fbtech-nos-archive-keyring.asc site/fbtech-nos-archive-keyring.asc
          touch site/.nojekyll
          cat > site/index.html <<HTML
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <title>fbtech-nos apt repository</title>
          </head>
          <body>
          <h1>fbtech-nos apt repository</h1>
          <p>Signed apt repository of fbtech-nos overlay packages for Debian trixie.</p>
          <p>Add it with:</p>
          <pre>curl -fsSL ${PAGES_URL}/fbtech-nos-archive-keyring.asc | sudo tee /usr/share/keyrings/fbtech-nos-archive-keyring.asc >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/fbtech-nos-archive-keyring.asc] ${PAGES_URL} trixie main" | sudo tee /etc/apt/sources.list.d/fbtech-nos.list
          sudo apt-get update</pre>
          <p>Source: <a href="https://github.com/${{ github.repository }}">${{ github.repository }}</a></p>
          </body>
          </html>
          HTML

      - name: Push to gh-pages
        run: |
          set -euo pipefail
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish apt repository ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push --force origin HEAD:gh-pages

  verify:
    needs: publish
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie
    steps:
      - name: Install prerequisites
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl gnupg

      - name: Wait for GitHub Pages to serve the new InRelease
        run: |
          set -euo pipefail
          url="${PAGES_URL}/dists/trixie/InRelease"
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url" || true)
            if [ "$code" = "200" ]; then
              echo "InRelease is live (attempt $i)."
              exit 0
            fi
            echo "Attempt $i: got HTTP $code for $url, retrying in 30s..."
            sleep 30
          done
          echo "::error::Timed out waiting for ${url} to become available"
          exit 1

      - name: Configure the fbtech-nos apt repository
        run: |
          set -euo pipefail
          curl -fsSL "${PAGES_URL}/fbtech-nos-archive-keyring.asc" -o /usr/share/keyrings/fbtech-nos-archive-keyring.asc
          echo "deb [signed-by=/usr/share/keyrings/fbtech-nos-archive-keyring.asc] ${PAGES_URL} trixie main" \
            > /etc/apt/sources.list.d/fbtech-nos.list
          apt-get update

      - name: Install and smoke-test overlay packages
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get install -y unionfs-fuse ipaddrcheck vyatta-biosdevname hvinfo
          unionfs-fuse --version
          ipaddrcheck --version
